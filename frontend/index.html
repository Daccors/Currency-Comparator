<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comparateur de devises</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>Comparateur de taux de change</h1>

    <form id="convert-form">
      <label>
        Montant
        <input type="number" id="amount" min="0.01" step="0.01" value="100" required />
      </label>

            <label>
        De
        <select id="from">
          <option value="EUR">EUR</option>
          <option value="USD">USD</option>
          <option value="GBP">GBP</option>
          <option value="CHF">CHF</option>
          <option value="JPY">JPY</option>
          <option value="CAD">CAD</option>
          <option value="AUD">AUD</option>
          <option value="CNY">CNY</option>
          <option value="INR">INR</option>
          <option value="BRL">BRL</option>
          <option value="MXN">MXN</option>
          <option value="SEK">SEK</option>
          <option value="NOK">NOK</option>
          <option value="NZD">NZD</option>
          <option value="SGD">SGD</option>
        </select>
      </label>

      <label>
        Vers
        <select id="to">
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
          <option value="GBP">GBP</option>
          <option value="CHF">CHF</option>
          <option value="JPY">JPY</option>
          <option value="CAD">CAD</option>
          <option value="AUD">AUD</option>
          <option value="CNY">CNY</option>
          <option value="INR">INR</option>
          <option value="BRL">BRL</option>
          <option value="MXN">MXN</option>
          <option value="SEK">SEK</option>
          <option value="NOK">NOK</option>
          <option value="NZD">NZD</option>
          <option value="SGD">SGD</option>
        </select>
      </label>

      <button type="submit">Convertir</button>
    </form>

    <section id="result" class="result" hidden></section>
    <section id="error" class="error" hidden></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
